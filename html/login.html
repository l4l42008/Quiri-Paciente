<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiri Paciente — Entrar</title>

    <!-- carrega as fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- carrega os icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* reseta os espacamentos padrao */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* define o estilo geral da pagina */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2D6A4F;
            font-family: "Montserrat", sans-serif;
            color: #F5EFE0;
            padding: 40px 20px;
        }

        /* organiza o bloco principal da pagina */
        .card {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* define o estilo da logo */
        .logo {
            width: 190px;
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 2px;
        }

        /* define o estilo da frase abaixo da logo */
        .tagline {
            font-family: "Caveat", cursive;
            font-weight: 600;
            font-size: 1.55rem;
            color: #F5EFE0;
            text-align: center;
            margin-bottom: 34px;
        }

        /* organiza o formulario */
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* esconde o label sem prejudicar a acessibilidade */
        .field label {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
        }

        /* define o estilo da caixa do campo */
        .field-wrap {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #F5EFE0;
            border-radius: 8px;
            min-height: 52px;
            padding: 0 16px;
            border: 1.5px solid transparent;
            transition: border-color 0.2s ease;
        }

        /* destaca o campo qnd ele esta selecionado */
        .field-wrap:focus-within {
            border-color: #2D6A4F;
        }

        /* define o estilo do icone do campo */
        .field-wrap i.field-icon {
            color: #2D6A4F;
            font-size: 0.95rem;
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        /* define o estilo do campo de entrada */
        .field-wrap input {
            flex: 1;
            min-width: 0;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #2D6A4F;
            -webkit-text-fill-color: #2D6A4F;
            font-family: "Montserrat", sans-serif;
            font-weight: 700;
            font-size: 0.74rem;
            letter-spacing: 0.08em;
        }

        /* define o estilo do texto do placeholder */
        .field-wrap input::placeholder {
            color: rgba(45, 106, 79, .75);
            opacity: 1;
        }

        /* define o estilo do botao pra mostrar a senha */
        .toggle-pass {
            background: none;
            border: none;
            color: #2D6A4F;
            opacity: 0.8;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 8px;
            flex-shrink: 0;
        }

        /* destaca o botao qnd passa o mouse */
        .toggle-pass:hover {
            opacity: 1;
        }

        /* define o estilo da mensagem de erro */
        .error-message {
            display: none;
            color: #F5EFE0;
            margin-top: 7px;
            font-size: 0.8rem;
            line-height: 1.5;
        }

        /* mostra a mensagem de erro qnd necessario */
        .error-message.show {
            display: block;
        }

        /* destaca o campo qnd ocorre um erro */
        .input-error {
            border-color: rgba(245, 239, 224, .75) !important;
        }

        /* define o estilo do link pra recuperar a senha */
        .forgot {
            display: table;
            margin: 0 auto;
            color: #F5EFE0;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-size: 0.65rem;
        }

        /* destaca o link qnd passa o mouse */
        .forgot:hover {
            text-decoration: underline;
        }

        /* define o estilo do botao principal */
        .btn-primary {
            margin-top: 10px;
            min-height: 54px;
            border: 2px solid #F5EFE0;
            border-radius: 10px;
            background: #F5EFE0;
            color: #2D6A4F;
            font-family: "Montserrat", sans-serif;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.12s ease;
        }

        /* aplica o efeito do botao qnd passa o mouse */
        .btn-primary:hover {
            background: rgba(245, 239, 224, .9);
            transform: translateY(-1px);
        }

        /* indica qnd o botao esta desativado */
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
        }

        /* organiza o separador do formulario */
        .divider {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 32px 0 22px;
        }

        /* cria a linha do separador */
        .divider::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: #F5EFE0;
            opacity: 0.45;
        }

        /* define o estilo do texto do separador */
        .divider span {
            position: relative;
            background: #2D6A4F;
            padding: 0 16px;
            font-family: "Caveat", cursive;
            font-weight: 600;
            font-size: 1.25rem;
            color: #F5EFE0;
        }

        /* define o estilo do texto de cadastro */
        .signup-link {
            text-align: center;
            font-size: 0.78rem;
            color: #F5EFE0;
            letter-spacing: 0.02em;
        }

        /* define o estilo do link de cadastro */
        .signup-link a {
            color: #F5EFE0;
            font-weight: 800;
            text-decoration: none;
            border-bottom: 1.5px solid rgba(245, 239, 224, .75);
        }

        /* destaca o link de cadastro qnd passa o mouse */
        .signup-link a:hover {
            border-color: #F5EFE0;
        }

        /* destaca os elementos selecionados pelo teclado */
        :focus-visible {
            outline: 2px solid #F5EFE0;
            outline-offset: 3px;
        }

        /* ajusta a pagina pra telas menores */
        @media (max-width: 340px) {
            /* diminui a logo em telas pequenas */
            .logo {
                width: 160px;
            }

            /* ajusta o tamanho da frase em telas pequenas */
            .tagline {
                font-size: 1.35rem;
            }
        }
    </style>
</head>

<body>
    <!-- organiza o conteudo principal da pagina -->
    <main class="card">
        <!-- mostra a logo do quiri -->
        <img class="logo" src="/imagens/logobranca.png" alt="logo quiri">

        <!-- mostra a frase abaixo da logo -->
        <p class="tagline">A melhor ferramenta para você!</p>

        <!-- organiza o formulario -->
        <form id="formLogin" autocomplete="on">
            <div class="field">
                <!-- define o label acessivel do campo de email -->
                <label for="login">E-mail</label>

                <!-- cria o campo de email -->
                <div class="field-wrap">
                    <i class="field-icon fa-solid fa-envelope" aria-hidden="true"></i>

                    <input
                        id="login"
                        name="email"
                        type="email"
                        placeholder="E-MAIL"
                        autocomplete="username"
                        maxlength="255"
                        required
                    >
                </div>
            </div>

            <div class="field">
                <!-- define o label acessivel do campo de senha -->
                <label for="password">Senha</label>

                <!-- cria o campo de senha -->
                <div class="field-wrap">
                    <i class="field-icon fa-solid fa-lock" aria-hidden="true"></i>

                    <input
                        id="password"
                        name="senha"
                        type="password"
                        placeholder="SENHA"
                        autocomplete="current-password"
                        required
                    >

                    <!-- cria o botao pra mostrar ou esconder a senha -->
                    <button
                        type="button"
                        class="toggle-pass"
                        id="togglePass"
                        aria-label="Mostrar senha"
                        aria-pressed="false"
                    >
                        <i class="fa-solid fa-eye" aria-hidden="true"></i>
                    </button>
                </div>

                <!-- mostra a mensagem de erro do login -->
                <p id="err-login" class="error-message" role="alert" aria-live="polite"></p>
            </div>

            <!-- cria o link pra recuperar a senha -->
            <a class="forgot" href="esqueci-senha.html">Esqueceu a senha?</a>

            <!-- envia os dados do login -->
            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <!-- organiza o separador do formulario -->
        <div class="divider">
            <span></span>
        </div>

        <!-- mostra o link pra criar uma conta -->
        <p class="signup-link">
            Não tem conta?
            <a href="cadastro.html">Cadastre-se</a>
        </p>
    </main>

    <!-- carrega o javascript do login -->
    <script src="/js/login.js" defer></script>
</body>
</html>
