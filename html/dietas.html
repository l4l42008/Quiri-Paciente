<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiri — Dietas</title>

    <!-- carrega os icones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        /* aplica o box sizing em todos os elementos */
        * {
            box-sizing: border-box;
        }
        /* define o estilo geral da pagina */
        body {
            margin: 0;
            background: #2D6A4F;
            color: #F5EFE0;
            font-family: Arial, sans-serif;
        }
        /* impede a rolagem qnd um modal ou menu estiver aberto */
        body.modal-aberto,
        body.menu-aberto {
            overflow: hidden;
        }
        /* padroniza a fonte dos campos e botoes */
        button,
        input,
        textarea {
            font: inherit;
        }
        /* mostra a mao nos botoes clicaveis */
        button {
            cursor: pointer;
        }
        /* organiza a barra superior */
        .barra-superior {
            height: 108px;
            padding: 0 40px;
            background: #F5EFE0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }
        /* organiza o espaco da logo */
        .topbar-logo {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* ajusta o tamanho da logo */
        .topbar-logo img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }
        /* posiciona o botao do menu */
        .botao-menu {
            grid-column: 3;
            justify-self: end;
            width: 46px;
            height: 46px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        /* destaca o botao do menu ao passar o mouse */
        .botao-menu:hover {
            background: rgba(45, 106, 79, .1);
        }
        /* cria as tres linhas do botao do menu */
        .botao-menu span {
            width: 24px;
            height: 2.5px;
            border-radius: 3px;
            background: #2D6A4F;
        }
        /* cria o fundo escuro do menu lateral */
        .fundo-menu {
            position: fixed;
            inset: 0;
            z-index: 30;
            background: rgba(0, 0, 0, 0.25);
            opacity: 0;
            visibility: hidden;
            transition: .25s;
        }
        /* mostra o fundo qnd o menu estiver aberto */
        .fundo-menu.aberto {
            opacity: 1;
            visibility: visible;
        }
        /* posiciona o menu lateral fora da tela */
        .menu-lateral {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 31;
            width: min(320px, 85vw);
            height: 100%;
            padding: 24px 18px;
            overflow-y: auto;
            background: #F5EFE0;
            color: #2D6A4F;
            transform: translateX(100%);
            visibility: hidden;
            transition: .25s;
        }
        /* traz o menu lateral pra dentro da tela */
        .menu-lateral.aberto {
            transform: translateX(0);
            visibility: visible;
        }
        /* organiza o titulo e o botao de fechar do menu */
        .menu-cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        /* ajusta o titulo do menu */
        .menu-cabecalho h2 {
            margin: 0;
            font-size: 22px;
        }
        /* estiliza o botao de fechar o menu */
        .menu-cabecalho button {
            width: 42px;
            height: 42px;
            border: 0;
            background: transparent;
            color: #2D6A4F;
            font-size: 25px;
        }
        /* organiza os links do menu */
        .item-menu {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px 12px;
            margin: 3px 0;
            border-radius: 9px;
            color: #2D6A4F;
            font-size: 14px;
            text-decoration: none;
        }
        /* ajusta o tamanho dos icones do menu */
        .item-menu i {
            font-size: 20px;
        }
        /* destaca o link ativo e o link sob o mouse */
        .item-menu:hover,
        .item-menu.ativo {
            background: rgba(45, 106, 79, .15);
        }
        /* cria a linha que separa os links */
        .menu-separador {
            height: 1px;
            margin: 18px 8px;
            background: rgba(45, 106, 79, .25);
        }
        /* limita e centraliza o conteudo principal */
        main {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 40px;
        }
        /* define o espaco abaixo do cabecalho */
        .cabecalho-pagina {
            margin-bottom: 25px;
        }
        /* estiliza o titulo da pagina */
        .cabecalho-pagina h1 {
            margin: 0;
            font-size: 25px;
        }
        /* organiza a lista de dietas */
        #listaDietas {
            display: grid;
            gap: 14px;
        }
        /* estiliza cada cartao de dieta */
        .dieta {
            width: 100%;
            padding: 18px;
            border: 1px solid rgba(245, 239, 224, .2);
            border-radius: 12px;
            background: #F5EFE0;
            color: #2D6A4F;
            text-align: left;
            transition: transform .15s, box-shadow .15s;
        }
        /* movimenta o cartao ao passar o mouse */
        .dieta:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(45, 106, 79, .2);
        }
        /* estiliza o titulo de cada dieta */
        .dieta h2 {
            margin: 0 0 10px;
            font-size: 18px;
            overflow-wrap: anywhere;
        }
        /* estiliza as informacoes dos cartoes */
        .dieta p {
            margin: 6px 0;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }
        /* estiliza as mensagens informativas */
        .mensagem {
            color: #F5EFE0;
            font-size: 14px;
            line-height: 1.6;
        }
        /* cria a camada de fundo dos modais */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(45, 106, 79, .85);
        }
        /* exibe o modal qnd ele estiver aberto */
        .modal.aberto {
            display: flex;
        }
        /* define o visual e o tamanho do conteudo dos modais */
        .modal-conteudo {
            width: 100%;
            max-width: 540px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            border-radius: 14px;
            background: #F5EFE0;
            color: #2D6A4F;
        }
        /* organiza o cabecalho dos modais */
        .modal-cabecalho {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }
        /* estiliza os titulos dos modais */
        .modal-cabecalho h2 {
            margin: 0;
            font-size: 21px;
            overflow-wrap: anywhere;
        }
        /* estiliza o botao de fechar os modais */
        .fechar-modal {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            padding: 0;
            border: none;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            color: #2D6A4F;
            font-size: 25px;
            cursor: pointer;
        }
        /* mantem o visual do botao de fechar sem fundo */
        .fechar-modal:hover,
        .fechar-modal:focus,
        .fechar-modal:active {
            background: transparent;
            box-shadow: none;
            outline: none;
        }
        /* estiliza os detalhes da dieta */
        .detalhe {
            margin: 12px 0;
            line-height: 1.6;
            font-size: 14px;
            overflow-wrap: anywhere;
        }
        /* organiza os botoes dos modais */
        .acoes-modal {
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 22px;
        }
        /* define o estilo geral dos botoes */
        .botao {
            padding: 11px 16px;
            border: 0;
            border-radius: 8px;
            font-weight: bold;
        }
        /* define o estilo do botao principal */
        .botao-principal {
            background: #2D6A4F;
            color: #F5EFE0;
        }
        /* aplica transparencia no hover sem mudar a cor da marca */
        .botao-principal:hover {
            background: rgba(45, 106, 79, .85);
        }
        /* organiza os campos do formulario */
        .campo {
            display: grid;
            gap: 8px;
            margin: 16px 0;
        }
        /* destaca os nomes dos campos */
        .campo label {
            font-size: 14px;
            font-weight: bold;
        }
        /* estiliza a area de texto do feedback */
        .campo textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            border: 1px solid rgba(45, 106, 79, .25);
            border-radius: 8px;
            background: #F5EFE0;
            color: #2D6A4F;
            resize: vertical;
        }
        /* organiza as estrelas de avaliacao */
        .estrelas {
            display: flex;
            gap: 8px;
        }
        /* define o visual das estrelas */
        .estrela {
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
            color: rgba(45, 106, 79, .45);
            font-size: 32px;
        }
        /* remove o fundo dos botoes de estrela */
        .estrela:hover,
        .estrela:focus {
            background: transparent;
            box-shadow: none;
            outline: none;
        }
        /* destaca as estrelas selecionadas */
        .estrela.selecionada {
            color: #2D6A4F;
        }
        /* reserva espaco para mensagens do formulario */
        #mensagemFeedback {
            min-height: 20px;
            font-size: 13px;
            line-height: 1.5;
        }
        /* mostra q o envio esta em andamento */
        #salvarFeedback:disabled {
            opacity: .65;
            cursor: wait;
        }
        /* adapta a pagina para celulares e tablets */
        @media (max-width: 700px) {
            /* diminui a altura e o espacamento da barra */
            .barra-superior {
                height: 76px;
                padding: 0 20px;
            }
            /* diminui a logo em telas menores */
            .topbar-logo img {
                width: 48px;
                height: 48px;
                object-fit: contain;
            }
            /* reduz o espacamento do conteudo principal */
            main {
                padding: 24px 18px;
            }
            /* ajusta o titulo em telas menores */
            .cabecalho-pagina h1 {
                font-size: 22px;
            }
            /* reduz o espacamento interno dos modais */
            .modal-conteudo {
                padding: 20px;
            }
        }
        /* adapta os elementos para celulares bem pequenos */
        @media (max-width: 380px) {
            /* diminui as margens laterais */
            main {
                padding: 20px 12px;
            }
            /* reduz o espacamento dos cartoes */
            .dieta {
                padding: 14px;
            }
            /* deixa os botoes ocuparem a largura toda */
            .acoes-modal .botao {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- cria a barra superior com a logo e o botao do menu -->
    <header class="barra-superior">
        <div></div>
        <!-- leva o usuario para a pagina inicial -->
        <a href="/dashboard.html" class="topbar-logo" aria-label="Página inicial">
            <img src="/imagens/logoquiri.png" alt="Logo Quiri">
        </a>
        <!-- abre o menu lateral -->
        <button class="botao-menu" id="abrirMenu" type="button" aria-label="Abrir menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>
    <!-- escurece o fundo qnd o menu lateral abre -->
    <div class="fundo-menu" id="fundoMenu"></div>
    <!-- contem os links principais do sistema -->
    <aside class="menu-lateral" id="menuLateral" aria-hidden="true">
        <!-- mostra o titulo e o botao de fechar -->
        <div class="menu-cabecalho">
            <h2>MENU</h2>
            <button id="fecharMenu" type="button" aria-label="Fechar menu">
                <i class="ti ti-x"></i>
            </button>
        </div>
        <!-- link para o inicio -->
        <a class="item-menu" href="/dashboard.html">
            <i class="ti ti-home"></i> Início
        </a>
        <!-- indica a pagina atual -->
        <a class="item-menu ativo" href="/dietas.html">
            <i class="ti ti-salad"></i> Dietas
        </a>
        <!-- link para as consultas -->
        <a class="item-menu" href="/consultas.html">
            <i class="ti ti-calendar"></i> Consultas
        </a>
        <!-- link para o leitor de codigo de barras -->
        <a class="item-menu" href="/leitor.html">
            <i class="ti ti-barcode"></i> Leitor de Código de Barras
        </a>
        <!-- separa os links principais dos links da conta -->
        <div class="menu-separador"></div>
        <!-- link para o perfil do paciente -->
        <a class="item-menu" href="/perfil.html">
            <i class="ti ti-user-circle"></i> Meu perfil
        </a>
        <!-- link para sair da conta -->
        <a class="item-menu" href="/login.html" id="btnSair">
            <i class="ti ti-logout"></i> Sair da conta
        </a>
    </aside>
    <!-- contem a lista principal de dietas -->
    <main>
        <!-- mostra o titulo da pagina -->
        <section class="cabecalho-pagina">
            <h1>DIETAS</h1>
        </section>
        <!-- recebe os cartoes carregados pela api -->
        <div id="listaDietas">
            <p class="mensagem">Carregando dietas...</p>
        </div>
    </main>
    <!-- modal com os detalhes da dieta selecionada -->
    <div class="modal" id="modalDetalhes" role="dialog" aria-modal="true" aria-labelledby="tituloDetalhes">
        <section class="modal-conteudo">
            <!-- mostra o titulo e o botao de fechar -->
            <div class="modal-cabecalho">
                <h2 id="tituloDetalhes">Detalhes da dieta</h2>
                <button class="fechar-modal" type="button" data-fechar="modalDetalhes" aria-label="Fechar">
                    ×
                </button>
            </div>
            <!-- recebe os detalhes da dieta selecionada -->
            <div id="conteudoDetalhes"></div>
            <!-- contem o botao para avaliar a dieta -->
            <div class="acoes-modal">
                <button class="botao botao-principal" id="abrirFeedback" type="button">
                    Dar feedback
                </button>
            </div>
        </section>
    </div>
    <!-- modal usado para avaliar a dieta -->
    <div class="modal" id="modalFeedback" role="dialog" aria-modal="true" aria-labelledby="tituloFeedback">
        <section class="modal-conteudo">
            <!-- mostra o titulo e o botao de fechar -->
            <div class="modal-cabecalho">
                <h2 id="tituloFeedback">Avaliar dieta</h2>
                <button class="fechar-modal" type="button" data-fechar="modalFeedback" aria-label="Fechar">
                    ×
                </button>
            </div>
            <!-- formulario usado para enviar a nota e o comentario -->
            <form id="formFeedback">
                <!-- campo para selecionar a nota em estrelas -->
                <div class="campo">
                    <label>Qual sua nota para esta dieta?</label>
                    <div class="estrelas" id="seletorEstrelas" aria-label="Nota de 1 a 5">
                        <button class="estrela" type="button" data-nota="1" aria-label="1 estrela" aria-pressed="false">★</button>
                        <button class="estrela" type="button" data-nota="2" aria-label="2 estrelas" aria-pressed="false">★</button>
                        <button class="estrela" type="button" data-nota="3" aria-label="3 estrelas" aria-pressed="false">★</button>
                        <button class="estrela" type="button" data-nota="4" aria-label="4 estrelas" aria-pressed="false">★</button>
                        <button class="estrela" type="button" data-nota="5" aria-label="5 estrelas" aria-pressed="false">★</button>
                    </div>
                </div>
                <!-- campo para escrever o comentario -->
                <div class="campo">
                    <label for="comentarioFeedback">Comentário</label>
                    <textarea id="comentarioFeedback" maxlength="1000" placeholder="Conte como foi esta dieta..."></textarea>
                </div>
                <!-- mostra mensagens de validacao e envio -->
                <p id="mensagemFeedback" aria-live="polite"></p>
                <!-- contem o botao para enviar o formulario -->
                <div class="acoes-modal">
                    <button class="botao botao-principal" id="salvarFeedback" type="submit">
                        Enviar feedback
                    </button>
                </div>
            </form>
        </section>
    </div>
    <script>
        // cria um atalho pra selecionar elementos da pagina
        const $ = seletor => document.querySelector(seletor);
        // guarda as referencias dos elementos principais
        const listaDietas = $("#listaDietas");
        const modalDetalhes = $("#modalDetalhes");
        const modalFeedback = $("#modalFeedback");
        // guarda a dieta atual e a nota escolhida
        let dietaSelecionada = null;
        let notaSelecionada = 0;
        // abre ou fecha o menu lateral e atualiza os estados acessiveis
        function controlarMenu(aberto) {
            $("#menuLateral").classList.toggle("aberto", aberto);
            $("#fundoMenu").classList.toggle("aberto", aberto);
            document.body.classList.toggle("menu-aberto", aberto);
            $("#menuLateral").setAttribute("aria-hidden", String(!aberto));
            $("#abrirMenu").setAttribute("aria-expanded", String(aberto));
        }
        // registra os eventos dos botoes do menu
        $("#abrirMenu").addEventListener("click", () => controlarMenu(true));
        $("#fecharMenu").addEventListener("click", () => controlarMenu(false));
        $("#fundoMenu").addEventListener("click", () => controlarMenu(false));
        // abre um modal e bloqueia a rolagem da pagina
        function abrirModal(modal) {
            modal.classList.add("aberto");
            document.body.classList.add("modal-aberto");
        }
        // fecha um modal e libera a rolagem se nao houver outro aberto
        function fecharModal(modal) {
            modal.classList.remove("aberto");
            if (!document.querySelector(".modal.aberto")) {
                document.body.classList.remove("modal-aberto");
            }
        }
        // registra o fechamento dos modais pelos botoes
        document.querySelectorAll("[data-fechar]").forEach(botao => {
            botao.addEventListener("click", () => {
                fecharModal(document.getElementById(botao.dataset.fechar));
            });
        });
        // fecha o modal qnd o usuario clica fora do conteudo
        document.querySelectorAll(".modal").forEach(modal => {
            modal.addEventListener("click", evento => {
                if (evento.target === modal) {
                    fecharModal(modal);
                }
            });
        });
        // permite fechar os modais e o menu usando a tecla esc
        document.addEventListener("keydown", evento => {
            if (evento.key === "Escape") {
                if (modalFeedback.classList.contains("aberto")) {
                    fecharModal(modalFeedback);
                } else if (modalDetalhes.classList.contains("aberto")) {
                    fecharModal(modalDetalhes);
                }
                controlarMenu(false);
            }
        });
        // transforma datas da api em datas legiveis
        function formatarData(valor) {
            if (!valor) return "Não informada";
            // trata datas que chegam no formato ano mes e dia
            if (typeof valor === "string" && /^\d{4}-\d{2}-\d{2}$/.test(valor)) {
                const [ano, mes, dia] = valor.split("-");
                return `${dia}/${mes}/${ano}`;
            }
            // prepara a variavel usada para converter a data
            let data;
            // trata timestamps do firebase no formato seconds
            if (typeof valor === "object" && typeof valor.seconds === "number") {
                data = new Date(valor.seconds * 1000);
            // trata timestamps do firebase no formato _seconds
            } else if (typeof valor === "object" && typeof valor._seconds === "number") {
                data = new Date(valor._seconds * 1000);
            // converte outras datas que chegam como texto
            } else if (typeof valor === "string") {
                data = new Date(valor);
            // retorna uma mensagem se o formato nao for reconhecido
            } else {
                return "Não informada";
            }
            // valida a data e retorna no formato brasileiro
            return Number.isNaN(data.getTime()) ? "Não informada" : data.toLocaleDateString("pt-BR");
        }
        // adiciona um detalhe ao modal usando elementos seguros
        function adicionarTexto(container, rotulo, valor) {
            const paragrafo = document.createElement("p");
            paragrafo.className = "detalhe";
            // cria o nome do campo
            const titulo = document.createElement("strong");
            titulo.textContent = `${rotulo}: `;
            // adiciona o titulo e o valor ao paragrafo
            paragrafo.append(titulo, document.createTextNode(valor || "Não informado"));
            container.appendChild(paragrafo);
        }
        // preenche e abre o modal da dieta selecionada
        function mostrarDetalhes(dieta) {
            dietaSelecionada = dieta;
            $("#tituloDetalhes").textContent = dieta.titulo || "Dieta";
            // limpa os detalhes anteriores
            const conteudo = $("#conteudoDetalhes");
            conteudo.replaceChildren();
            // adiciona as informacoes da dieta
            adicionarTexto(conteudo, "Descrição", dieta.descricao);
            adicionarTexto(conteudo, "Início", formatarData(dieta.data_inicio));
            adicionarTexto(conteudo, "Término", formatarData(dieta.data_fim));
            adicionarTexto(conteudo, "Nutricionista", dieta.nomeNutricionista);
            // exibe o modal com os dados atualizados
            abrirModal(modalDetalhes);
        }
        // busca as dietas do paciente na api
        async function carregarDietas() {
            // recupera o identificador do paciente salvo no navegador
            const uidPaciente = localStorage.getItem("uidPaciente");
            // pede login novamente se nao houver identificador
            if (!uidPaciente) {
                listaDietas.innerHTML = '<p class="mensagem">Faça login novamente para consultar suas dietas.</p>';
                return;
            }
            try {
                // consulta os dados do paciente usando o identificador
                const resposta = await fetch("/api/paciente/dashboard", {
                    headers: {
                        "x-paciente-uid": uidPaciente
                    }
                });
                // converte a resposta da api para json
                const dados = await resposta.json();
                // trata respostas que indicam erro
                if (!resposta.ok) {
                    throw new Error(dados.mensagem || "Erro ao carregar dietas.");
                }
                // recupera a lista de dietas recebida
                const dietas = dados.dietas || [];
                listaDietas.replaceChildren();
                // mostra uma mensagem se o paciente nao tiver dietas
                if (dietas.length === 0) {
                    listaDietas.innerHTML = '<p class="mensagem">Nenhuma dieta cadastrada.</p>';
                    return;
                }
                // cria um cartao para cada dieta recebida
                dietas.forEach(dieta => {
                    const cartao = document.createElement("button");
                    cartao.type = "button";
                    cartao.className = "dieta";
                    // define o titulo do cartao
                    const titulo = document.createElement("h2");
                    titulo.textContent = dieta.titulo || "Dieta sem título";
                    // mostra as datas de inicio e termino
                    const datas = document.createElement("p");
                    datas.textContent = `Início: ${formatarData(dieta.data_inicio)} · Término: ${formatarData(dieta.data_fim)}`;
                    // mostra o nome do nutricionista
                    const nutricionista = document.createElement("p");
                    nutricionista.textContent = `Nutricionista: ${dieta.nomeNutricionista || "Não informado"}`;
                    // adiciona as informacoes ao cartao
                    cartao.append(titulo, datas, nutricionista);
                    // abre os detalhes qnd o cartao for clicado
                    cartao.addEventListener("click", () => {
                        mostrarDetalhes(dieta);
                    });
                    // coloca o cartao na lista
                    listaDietas.appendChild(cartao);
                });
            } catch (erro) {
                // registra o erro para facilitar a depuracao
                console.error("Erro ao carregar dietas:", erro);
                // informa ao usuario que nao foi possivel carregar os dados
                listaDietas.innerHTML = '<p class="mensagem">Não foi possível carregar as dietas. Atualize a página e tente novamente.</p>';
            }
        }
        // prepara o formulario qnd o usuario escolhe dar feedback
        $("#abrirFeedback").addEventListener("click", () => {
            if (!dietaSelecionada) return;
            // limpa a nota e o comentario anteriores
            notaSelecionada = 0;
            $("#comentarioFeedback").value = "";
            $("#mensagemFeedback").textContent = "";
            // atualiza as estrelas e abre o formulario
            atualizarEstrelas();
            abrirModal(modalFeedback);
        });
        // atualiza o visual e a acessibilidade das estrelas
        function atualizarEstrelas() {
            document.querySelectorAll(".estrela").forEach(botao => {
                const selecionada = Number(botao.dataset.nota) <= notaSelecionada;
                botao.classList.toggle("selecionada", selecionada);
                botao.setAttribute("aria-pressed", String(selecionada));
            });
        }
        // registra a nota escolhida pelo usuario
        document.querySelectorAll(".estrela").forEach(botao => {
            botao.addEventListener("click", () => {
                notaSelecionada = Number(botao.dataset.nota);
                atualizarEstrelas();
            });
        });
        // valida e envia o feedback da dieta
        $("#formFeedback").addEventListener("submit", async evento => {
            evento.preventDefault();
            // interrompe o envio se nao houver dieta selecionada
            if (!dietaSelecionada) return;
            // exige uma nota entre uma e cinco estrelas
            if (notaSelecionada < 1 || notaSelecionada > 5) {
                $("#mensagemFeedback").textContent = "Selecione uma nota de 1 a 5 estrelas.";
                return;
            }
            // recupera e limpa o comentario escrito
            const comentario = $("#comentarioFeedback").value.trim();
            // exige um comentario antes de enviar
            if (!comentario) {
                $("#mensagemFeedback").textContent = "Escreva um comentário antes de enviar.";
                $("#comentarioFeedback").focus();
                return;
            }
            // recupera o identificador do paciente e o botao de envio
            const uidPaciente = localStorage.getItem("uidPaciente");
            const botao = $("#salvarFeedback");
            // bloqueia o botao enquanto o envio estiver acontecendo
            botao.disabled = true;
            botao.textContent = "Enviando...";
            $("#mensagemFeedback").textContent = "";
            try {
                // envia a avaliacao para a api
                const resposta = await fetch("/api/paciente/feedback", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        uidPaciente,
                        id_dieta: dietaSelecionada.id,
                        nota: notaSelecionada,
                        comentario
                    })
                });
                // converte o retorno da api para json
                const resultado = await resposta.json();
                // mostra um erro se a api nao aceitar o envio
                if (!resposta.ok) {
                    throw new Error(resultado.mensagem || "Não foi possível enviar o feedback.");
                }
                // fecha os modais apos o envio bem sucedido
                fecharModal(modalFeedback);
                fecharModal(modalDetalhes);
                // confirma o envio do feedback
                alert("Feedback enviado com sucesso!");
            } catch (erro) {
                // mostra a mensagem de erro no formulario
                $("#mensagemFeedback").textContent = erro.message;
            } finally {
                // libera o botao e restaura o texto original
                botao.disabled = false;
                botao.textContent = "Enviar feedback";
            }
        });
        // remove o identificador salvo qnd o usuario sair da conta
        $("#btnSair").addEventListener("click", () => {
            localStorage.removeItem("uidPaciente");
        });
        // carrega as dietas assim q a pagina iniciar
        carregarDietas();
    </script>
</body>
</html>
