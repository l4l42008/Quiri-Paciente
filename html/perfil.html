<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiri — Perfil</title>

    <!-- carrega os icones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        /* reseta os espacamentos padrao */
        * {
            box-sizing: border-box;
        }

        /* define o estilo geral da pagina */
        body {
            margin: 0;
            min-height: 100vh;
            background: #2D6A4F;
            color: #2D6A4F;
            font-family: Arial, sans-serif;
        }

        button, input {
            font: inherit;
        }

        button, a {
            -webkit-tap-highlight-color: transparent;
        }

        /* organiza a barra superior */
        .barra-superior {
            height: 102px;
            padding: 0 40px;
            background: #F5EFE0;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }

        /* define o estilo da logo */
        .logo {
            grid-column: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
        }

        .logo img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }

        /* define o estilo do botao do menu */
        .botao-menu {
            grid-column: 3;
            justify-self: end;
            width: 46px;
            height: 46px;
            padding: 0;
            border: 0;
            border-radius: 8px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .botao-menu:hover {
            background: rgba(45, 106, 79, .08);
        }

        .botao-menu span {
            width: 24px;
            height: 2.5px;
            border-radius: 3px;
            background: #2D6A4F;
        }

        /* define o fundo do menu lateral */
        .fundo-menu {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(0, 0, 0, 0.25);
            opacity: 0;
            visibility: hidden;
            transition: .25s;
        }

        /* mostra o fundo qnd o menu esta aberto */
        .fundo-menu.aberto {
            opacity: 1;
            visibility: visible;
        }

        /* define o estilo do menu lateral */
        .menu-lateral {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 21;
            width: min(320px, 85vw);
            height: 100%;
            padding: 24px 18px;
            background: #F5EFE0;
            transform: translateX(100%);
            visibility: hidden;
            transition: .25s;
            overflow-y: auto;
        }

        /* mostra o menu lateral qnd ele esta aberto */
        .menu-lateral.aberto {
            transform: translateX(0);
            visibility: visible;
        }

        /* organiza o cabecalho do menu */
        .menu-cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .menu-cabecalho h2 {
            margin: 0;
            color: #2D6A4F;
            font-size: 22px;
        }

        /* define o estilo do botao de fechar o menu */
        .fechar-menu {
            width: 42px;
            height: 42px;
            border: 0;
            background: transparent;
            color: #2D6A4F;
            font-size: 25px;
            cursor: pointer;
        }

        /* define o estilo dos links do menu */
        .item-menu {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 14px 12px;
            margin: 3px 0;
            border-radius: 9px;
            color: #2D6A4F;
            text-decoration: none;
            font-size: 14px;
        }

        .item-menu i {
            font-size: 20px;
        }

        /* destaca o item selecionado ou qnd passa o mouse */
        .item-menu:hover,
        .item-menu.ativo {
            background: rgba(45, 106, 79, .12);
        }

        /* define o estilo do separador do menu */
        .menu-separador {
            height: 1px;
            margin: 18px 8px;
            background: rgba(45, 106, 79, .18);
        }

        /* organiza o conteudo principal da pagina */
        main {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 36px 28px 48px;
        }

        /* define o estilo do titulo da pagina */
        .titulo-pagina {
            margin: 0 0 24px;
            color: #F5EFE0;
            font-size: 25px;
        }

        /* define o estilo do cartao de perfil */
        .cartao-perfil {
            padding: 30px;
            border-radius: 16px;
            background: #F5EFE0;
        }

        /* organiza o cabecalho do perfil */
        .cabecalho-perfil {
            display: flex;
            align-items: center;
            gap: 18px;
            padding-bottom: 24px;
            margin-bottom: 26px;
            border-bottom: 1px solid rgba(45, 106, 79, .2);
        }

        /* define o estilo da identificacao do paciente */
        .identificacao h2 {
            margin: 0 0 7px;
            font-size: 21px;
            overflow-wrap: anywhere;
        }

        .identificacao p {
            margin: 0;
            color: rgba(45, 106, 79, .75);
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        /* organiza os campos do formulario */
        .formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* organiza cada campo do formulario */
        .campo {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* faz o campo ocupar toda a largura */
        .campo.largura-total {
            grid-column: 1 / -1;
        }

        /* define o estilo dos textos dos campos */
        .campo label {
            color: rgba(45, 106, 79, .75);
            font-size: 13px;
        }

        /* define o estilo dos campos de entrada */
        .campo input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid rgba(45, 106, 79, .35);
            border-radius: 11px;
            outline: none;
            background: #F5EFE0;
            color: #2D6A4F;
            font-size: 14px;
            transition: border-color .2s, box-shadow .2s;
        }

        /* destaca o campo qnd ele esta selecionado */
        .campo input:focus {
            border-color: #2D6A4F;
            box-shadow: 0 0 0 2px rgba(45, 106, 79, .1);
        }

        /* indica qnd o campo esta desativado */
        .campo input:disabled {
            background: rgba(45, 106, 79, .08);
            color: rgba(45, 106, 79, .75);
            cursor: not-allowed;
        }

        /* define o estilo do texto de ajuda */
        .ajuda-campo {
            margin: 0;
            color: rgba(45, 106, 79, .75);
            font-size: 12px;
            line-height: 1.5;
        }

        /* organiza os botoes de acao */
        .acoes {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 26px;
        }

        /* define o estilo geral dos botoes */
        .botao {
            min-height: 45px;
            padding: 0 20px;
            border: 0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background .2s, opacity .2s;
        }

        /* define o estilo do botao de editar */
        .botao-editar {
            background: rgba(45, 106, 79, .12);
            color: #2D6A4F;
        }

        .botao-editar:hover {
            background: rgba(45, 106, 79, .2);
        }

        /* define o estilo do botao de salvar */
        .botao-salvar {
            flex: 1;
            background: #2D6A4F;
            color: #F5EFE0;
        }

        .botao-salvar:hover {
            background: rgba(45, 106, 79, .85);
        }

        /* indica qnd o botao esta desativado */
        .botao:disabled {
            opacity: .65;
            cursor: wait;
        }

        /* define o estilo da mensagem de retorno */
        #mensagem {
            margin: 18px 0 0;
            font-size: 13px;
            line-height: 1.5;
        }

        /* destaca a mensagem de sucesso */
        #mensagem.sucesso {
            color: #2D6A4F;
        }

        /* destaca a mensagem de erro */
        #mensagem.erro {
            color: #2D6A4F;
        }

        /* organiza a area do nutricionista */
        .area-nutricionista {
            margin-top: 20px;
        }

        #nutricionistaAtual {
            margin: 0 0 12px;
            color: #2D6A4F;
            font-size: 14px;
        }

        #opcoesNutricionistas {
            margin-top: 16px;
        }

        /* esconde as opcoes qnd necessario */
        #opcoesNutricionistas[hidden] {
            display: none;
        }

        /* organiza a lista de nutricionistas */
        #listaNutricionistas {
            display: grid;
            gap: 10px;
            margin: 12px 0;
        }

        /* define o estilo de cada opcao de nutricionista */
        .opcao-nutricionista {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            border: 1px solid rgba(45, 106, 79, .35);
            border-radius: 10px;
            cursor: pointer;
        }

        /* destaca a opcao selecionada */
        .opcao-nutricionista:has(input:checked) {
            background: rgba(45, 106, 79, .12);
            border-color: #2D6A4F;
        }

        /* define o estilo dos botoes de selecao */
        .opcao-nutricionista input {
            width: auto;
            height: auto;
            accent-color: #2D6A4F;
        }

        /* ajusta a pagina pra telas menores */
        @media (max-width: 650px) {
            .barra-superior {
                height: 102px;
                padding: 0 20px;
            }

            main {
                padding: 26px 16px 36px;
            }

            .cartao-perfil {
                padding: 22px 18px;
            }

            .formulario {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .campo.largura-total {
                grid-column: auto;
            }

            .titulo-pagina {
                font-size: 22px;
            }

            .acoes {
                flex-direction: column;
            }

            .botao {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- organiza a barra superior -->
    <header class="barra-superior">
        <div></div>

        <!-- mostra a logo do quiri -->
        <a href="/dashboard.html" class="logo" aria-label="Página inicial">
            <img src="/imagens/logoquiri.png" alt="Quiri">
        </a>

        <!-- cria o botao para abrir o menu -->
        <button class="botao-menu" id="abrirMenu" type="button"
                aria-label="Abrir menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>

    <!-- mostra o fundo do menu lateral -->
    <div class="fundo-menu" id="fundoMenu"></div>

    <!-- organiza as opcoes do menu lateral -->
    <aside class="menu-lateral" id="menuLateral" aria-hidden="true">
        <div class="menu-cabecalho">
            <h2>MENU</h2>

            <!-- cria o botao para fechar o menu -->
            <button class="fechar-menu" id="fecharMenu" type="button"
                    aria-label="Fechar menu">
                <i class="ti ti-x"></i>
            </button>
        </div>

        <!-- cria o link para a pagina inicial -->
        <a class="item-menu" href="/dashboard.html">
            <i class="ti ti-home"></i> Início
        </a>

        <!-- cria o link para as dietas -->
        <a class="item-menu" href="/dietas.html">
            <i class="ti ti-salad"></i> Dietas
        </a>

        <!-- cria o link para as consultas -->
        <a class="item-menu" href="/consultas.html">
            <i class="ti ti-calendar"></i> Consultas
        </a>

        <!-- cria o link para o leitor de codigo de barras -->
        <a class="item-menu" href="/leitor.html">
            <i class="ti ti-barcode"></i> Leitor de Código de Barras
        </a>

        <!-- separa os links principais das opcoes da conta -->
        <div class="menu-separador"></div>

        <!-- destaca o link da pagina atual -->
        <a class="item-menu ativo" href="/perfil.html">
            <i class="ti ti-user-circle"></i> Perfil
        </a>

        <!-- cria o link para sair da conta -->
        <a class="item-menu" href="/login.html" id="btnSair">
            <i class="ti ti-logout"></i> Sair da conta
        </a>
    </aside>

    <!-- organiza o conteudo principal da pagina -->
    <main>
        <!-- mostra o titulo da pagina -->
        <h1 class="titulo-pagina">PERFIL</h1>

        <!-- organiza os dados do perfil -->
        <section class="cartao-perfil">
            <div class="cabecalho-perfil">
                <div class="identificacao">
                    <h2 id="nomeExibido">Carregando...</h2>
                    <p id="emailExibido">Carregando dados do paciente</p>
                </div>
            </div>

            <!-- organiza o formulario do perfil -->
            <form id="formPerfil">
                <div class="formulario">
                    <div class="campo largura-total">
                        <label for="nome">Nome completo</label>
                        <input id="nome" name="nome" type="text"
                               autocomplete="name" maxlength="120"
                               required disabled>
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input id="cpf" name="cpf" type="text"
                               inputmode="numeric" autocomplete="off"
                               maxlength="14" disabled>
                    </div>

                    <div class="campo">
                        <label for="nascimento">Data de nascimento</label>
                        <input id="nascimento" name="nascimento" type="date"
                               autocomplete="bday" disabled>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input id="telefone" name="telefone" type="tel"
                               autocomplete="tel" maxlength="20" required disabled>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email"
                               autocomplete="email" disabled>
                    </div>
                </div>

                <!-- organiza as opcoes de nutricionista -->
                <div class="campo largura-total area-nutricionista">
                    <label>Meu nutricionista</label>
                    <p id="nutricionistaAtual">Carregando nutricionista...</p>

                    <!-- permite alterar o nutricionista vinculado -->
                    <button class="botao botao-editar"
                            id="alterarNutricionista"
                            type="button" hidden>
                        Alterar nutricionista
                    </button>

                    <!-- mostra as opcoes de nutricionistas -->
                    <div id="opcoesNutricionistas" hidden>
                        <p class="ajuda-campo">Escolha um profissional ou continue sem vínculo.</p>
                        <div id="listaNutricionistas"></div>

                        <!-- cancela a alteracao do nutricionista -->
                        <button class="botao botao-editar"
                                id="cancelarAlteracaoNutri" type="button">
                            Cancelar
                        </button>
                    </div>
                </div>

                <!-- organiza os botoes de acao do perfil -->
                <div class="acoes">
                    <!-- ativa a edicao dos dados -->
                    <button class="botao botao-editar" id="editarPerfil"
                            type="button">
                        Editar dados
                    </button>

                    <!-- salva as alteracoes do perfil -->
                    <button class="botao botao-salvar" id="salvarPerfil"
                            type="submit" hidden>
                        Salvar alterações
                    </button>
                </div>

                <!-- mostra mensagens de retorno das operacoes -->
                <p id="mensagem" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script>
        // facilita a busca de elementos da pagina
        const $ = seletor => document.querySelector(seletor);

        // guarda o formulario do perfil
        const formulario = $("#formPerfil");

        // define os campos q podem ser editados
        const camposEditaveis = [
            $("#nome"),
            $("#nascimento"),
            $("#telefone")
        ];

        // guarda os dados originais e o estado da edicao
        let dadosOriginais = null;
        let modoEdicao = false;
        let nutricionistaSelecionado = null;
        let nutricionistaAlterado = false;

        // controla a abertura e o fechamento do menu
        function controlarMenu(aberto) {
            $("#menuLateral").classList.toggle("aberto", aberto);
            $("#fundoMenu").classList.toggle("aberto", aberto);
            $("#menuLateral").setAttribute("aria-hidden", String(!aberto));
            $("#abrirMenu").setAttribute("aria-expanded", String(aberto));
        }

        // abre o menu lateral
        $("#abrirMenu").addEventListener("click", () => controlarMenu(true));

        // fecha o menu pelo botao
        $("#fecharMenu").addEventListener("click", () => controlarMenu(false));

        // fecha o menu qnd clica no fundo
        $("#fundoMenu").addEventListener("click", () => controlarMenu(false));

        // fecha o menu qnd a tecla esc e pressionada
        document.addEventListener("keydown", evento => {
            if (evento.key === "Escape") controlarMenu(false);
        });

        // converte a data recebida para o formato do campo
        function formatarData(valor) {
            if (!valor) return "";

            if (typeof valor === "string") {
                if (/^\d{4}-\d{2}-\d{2}$/.test(valor)) return valor;

                const data = new Date(valor);

                if (Number.isNaN(data.getTime())) return "";

                return data.toISOString().slice(0, 10);
            }

            if (typeof valor === "object") {
                const segundos = valor.seconds ?? valor._seconds;

                if (typeof segundos === "number") {
                    return new Date(segundos * 1000).toISOString().slice(0, 10);
                }
            }

            return "";
        }

        // mostra uma mensagem na pagina
        function mostrarMensagem(texto, tipo = "") {
            const mensagem = $("#mensagem");
            mensagem.textContent = texto;
            mensagem.className = tipo;
        }

        // ativa ou desativa a edicao do perfil
        function definirEdicao(ativo) {
            modoEdicao = ativo;

            camposEditaveis.forEach(campo => {
                campo.disabled = !ativo;
            });

            $("#editarPerfil").hidden = ativo;
            $("#salvarPerfil").hidden = !ativo;

            // so mostra o botao de nutricionista durante a edicao
            $("#alterarNutricionista").hidden = !ativo;

            if (!ativo) {
                $("#opcoesNutricionistas").hidden = true;
            }

            $("#cpf").disabled = true;
            $("#email").disabled = true;

            mostrarMensagem("");
        }

        // preenche os campos com os dados do paciente
        function preencherPerfil(paciente) {
            $("#nome").value = paciente.nome || "";
            $("#cpf").value = paciente.cpf || "";
            $("#nascimento").value = formatarData(paciente.nascimento);
            $("#telefone").value = paciente.telefone || "";
            $("#email").value = paciente.email || "";

            $("#nomeExibido").textContent = paciente.nome || "Paciente";
            $("#emailExibido").textContent = paciente.email || "";

            nutricionistaSelecionado = paciente.id_nutricionista || null;

            $("#nutricionistaAtual").textContent =
                paciente.nomeNutricionista || "Nenhum nutricionista vinculado";

            // guarda os dados atuais para referencia
            dadosOriginais = {
                nome: $("#nome").value,
                nascimento: $("#nascimento").value,
                telefone: $("#telefone").value
            };
        }

        // busca os dados do perfil na api
        async function carregarPerfil() {
            const uidPaciente = localStorage.getItem("uidPaciente");

            if (!uidPaciente) {
                mostrarMensagem("Sua sessão expirou. Entre novamente.", "erro");
                $("#nomeExibido").textContent = "Paciente";
                return;
            }

            try {
                const resposta = await fetch("/api/paciente/dashboard", {
                    headers: {
                        "x-paciente-uid": uidPaciente
                    }
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        dados.mensagem || "Não foi possível carregar o perfil."
                    );
                }

                preencherPerfil(dados.paciente || {});
                definirEdicao(false);
            } catch (erro) {
                console.error("Erro ao carregar perfil:", erro);
                mostrarMensagem(erro.message, "erro");
                $("#nomeExibido").textContent = "Não foi possível carregar";
            }
        }

        // ativa a edicao dos dados do paciente
        $("#editarPerfil").addEventListener("click", () => {
            definirEdicao(true);
            $("#nome").focus();
        });

        // abre a lista de nutricionistas disponiveis
        $("#alterarNutricionista").addEventListener("click", async () => {
            const opcoes = $("#opcoesNutricionistas");

            if (!opcoes.hidden) {
                opcoes.hidden = true;
                return;
            }

            opcoes.hidden = false;

            const lista = $("#listaNutricionistas");
            lista.replaceChildren();

            statusNutricionistasTexto("Carregando nutricionistas...");

            try {
                const resposta = await fetch("/api/nutricionistas");
                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        resultado.mensagem ||
                        "Não foi possível carregar os nutricionistas."
                    );
                }

                // cria uma opcao de nutricionista na lista
                const criarOpcao = (id, nome, descricao = "") => {
                    const label = document.createElement("label");
                    label.className = "opcao-nutricionista";

                    const radio = document.createElement("input");
                    radio.type = "radio";
                    radio.name = "novo_nutricionista";
                    radio.value = id || "";
                    radio.checked = (id || null) === nutricionistaSelecionado;

                    // atualiza o nutricionista selecionado
                    radio.addEventListener("change", () => {
                        nutricionistaSelecionado = radio.value || null;
                        nutricionistaAlterado = true;

                        $("#nutricionistaAtual").textContent = id
                            ? `${nome}`
                            : "Você escolheu ficar sem nutricionista.";
                    });

                    const texto = document.createElement("span");
                    texto.textContent = descricao
                        ? `${nome} — ${descricao}`
                        : nome;

                    label.append(radio, texto);
                    lista.appendChild(label);
                };

                // adiciona a opcao de continuar sem nutricionista
                criarOpcao(
                    null,
                    "Nenhum nutricionista",
                    "Continuar sem vínculo"
                );

                // adiciona os nutricionistas recebidos da api
                (resultado.nutricionistas || []).forEach(nutri => {
                    criarOpcao(
                        nutri.id,
                        nutri.nome || "Nome não informado",
                        `CRN: ${nutri.crn || "Não informado"}`
                    );
                });

                statusNutricionistasTexto(
                    "Selecione uma opção e clique em Salvar alterações."
                );
            } catch (erro) {
                mostrarMensagem(erro.message, "erro");
            }
        });

        // atualiza o texto de ajuda das opcoes de nutricionista
        function statusNutricionistasTexto(texto) {
            const ajuda = $("#opcoesNutricionistas .ajuda-campo");

            if (ajuda) {
                ajuda.textContent = texto;
            }
        }

        // cancela a alteracao do nutricionista
        $("#cancelarAlteracaoNutri").addEventListener("click", () => {
            $("#opcoesNutricionistas").hidden = true;
            nutricionistaAlterado = false;
            carregarPerfil();
        });

        // valida e salva as alteracoes do perfil
        formulario.addEventListener("submit", async evento => {
            evento.preventDefault();

            if (!modoEdicao) return;

            const uidPaciente = localStorage.getItem("uidPaciente");
            const botaoSalvar = $("#salvarPerfil");

            if (!uidPaciente) {
                mostrarMensagem("Sua sessão expirou. Entre novamente.", "erro");
                return;
            }

            // coleta os dados preenchidos pelo paciente
            const dados = {
                nome: $("#nome").value.trim(),
                nascimento: $("#nascimento").value,
                telefone: $("#telefone").value.trim()
            };

            // verifica se os campos obrigatorios foram preenchidos
            if (!dados.nome || !dados.nascimento || !dados.telefone) {
                mostrarMensagem(
                    "Preencha o nome, a data de nascimento e o telefone.",
                    "erro"
                );
                return;
            }

            // impede o cadastro de uma data de nascimento futura
            if (new Date(`${dados.nascimento}T00:00:00`) > new Date()) {
                mostrarMensagem(
                    "A data de nascimento não pode estar no futuro.",
                    "erro"
                );
                return;
            }

            // desativa o botao enquanto os dados sao salvos
            botaoSalvar.disabled = true;
            botaoSalvar.textContent = "Salvando...";

            try {
                // envia as alteracoes para a api
                const resposta = await fetch("/api/paciente/perfil", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "x-paciente-uid": uidPaciente
                    },
                    body: JSON.stringify({
                        ...dados,
                        ...(nutricionistaAlterado
                            ? { id_nutricionista: nutricionistaSelecionado }
                            : {})
                    })
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        resultado.mensagem ||
                        "Não foi possível salvar as alterações."
                    );
                }

                // atualiza o perfil com os dados salvos
                nutricionistaAlterado = false;
                $("#opcoesNutricionistas").hidden = true;

                preencherPerfil({
                    ...dados,
                    cpf: $("#cpf").value,
                    email: $("#email").value,
                    id_nutricionista: nutricionistaSelecionado,
                    nomeNutricionista: $("#nutricionistaAtual").textContent
                });

                definirEdicao(false);

                mostrarMensagem(
                    "Suas alterações foram atualizadas com sucesso.",
                    "sucesso"
                );
            } catch (erro) {
                console.error("Erro ao salvar perfil:", erro);
                mostrarMensagem(erro.message, "erro");
            } finally {
                // reativa o botao depois de concluir a operacao
                botaoSalvar.disabled = false;
                botaoSalvar.textContent = "Salvar alterações";
            }
        });

        // remove a identificacao da sessao ao sair da conta
        $("#btnSair").addEventListener("click", () => {
            localStorage.removeItem("uidPaciente");
        });

        // carrega os dados do perfil ao abrir a pagina
        carregarPerfil();
    </script>
</body>
</html>
