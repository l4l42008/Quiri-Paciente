<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiri — Cadastro realizado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- carrega as fontes usadas na pagina -->
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Montserrat:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- carrega os icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* tira as margens e os espacos padrao pra organizar melhor os elementos */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* centraliza tudo na tela e define o fundo verde e o texto creme */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2D6A4F;
            color: #F5EFE0;
            font-family: 'Montserrat', sans-serif;
            padding: 40px 20px;
        }

        /* organiza o conteudo principal e limita a largura do card */
        .card {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* define o tamanho da logo e o espaco abaixo dela */
        .logo {
            width: 190px;
            height: auto;
            display: block;
            margin: 0 auto 30px;
        }

        /* estiliza a frase decorativa com a fonte caveat */
        .tagline {
            font-family: 'Caveat', cursive;
            font-weight: 600;
            font-size: 1.55rem;
            color: #F5EFE0;
            margin-bottom: 34px;
        }

        /* deixa o titulo maior e com as letras em maiusculo */
        h2 {
            color: #F5EFE0;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: .03em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        /* organiza a msg q confirma q o cadastro deu certo */
        .message {
            color: #F5EFE0;
            font-size: .78rem;
            line-height: 1.7;
            max-width: 330px;
            margin-bottom: 20px;
        }

        /* cria a caixa creme onde vai aparecer o email cadastrado */
        .email-box {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            background: #F5EFE0;
            color: #2D6A4F;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .04em;
            overflow-wrap: anywhere;
            margin-bottom: 22px;
        }

        /* estiliza o botao q leva o usuario pra tela de login */
        .btn-primary {
            width: 100%;
            min-height: 54px;
            border: none;
            border-radius: 10px;
            background: #F5EFE0;
            color: #2D6A4F;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: .9rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background .2s ease, transform .12s ease;
        }

        /* muda o botao qnd o mouse passa por cima */
        .btn-primary:hover {
            background: #F5EFE0;
            transform: translateY(-1px);
        }

        /* volta o botao pra posicao original qnd ele e pressionado */
        .btn-primary:active {
            transform: translateY(0);
        }

        /* ajusta o texto q fica abaixo do botao */
        .back-text {
            margin-top: 22px;
            font-size: .7rem;
            color: #F5EFE0;
            letter-spacing: .02em;
        }

        /* destaca os elementos qnd o usuario navega pelo teclado */
        :focus-visible {
            outline: 2px solid #F5EFE0;
            outline-offset: 3px;
        }

        /* diminui a logo e o texto em telas muito pequenas */
        @media (max-width: 340px) {
            .logo {
                width: 160px;
            }

            .tagline {
                font-size: 1.35rem;
            }
        }

        /* tira as animacoes pra quem prefere menos movimento */
        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <!-- agrupa os elementos q aparecem depois q o cadastro da certo -->
    <main class="card">
        <!-- mostra a logo do quiri -->
        <img class="logo" src="/imagens/logobranca.png" alt="logo quiri">

        <!-- avisa q o cadastro foi concluido -->
        <h2>Cadastro realizado!</h2>

        <!-- mostra uma msg confirmando q a conta foi criada -->
        <p class="message">
            Sua conta de paciente foi criada com sucesso.
        </p>

        <!-- reserva o espaco onde o email vai aparecer -->
        <p id="emailUsuario" class="email-box"></p>

        <!-- cria o botao q leva pra tela de login -->
        <button class="btn-primary" id="btnLogin" type="button">
            Ir para o login
        </button>
    </main>

    <script>
        // pega os parametros q vieram na url
        const parametros = new URLSearchParams(window.location.search);

        // pega o email q foi enviado pela url
        const email = parametros.get("email");

        // encontra a caixa onde o email vai aparecer
        const caixaEmail = document.getElementById("emailUsuario");

        // mostra o email se ele existir ou esconde a caixa se nao tiver email
        if (email) {
            caixaEmail.textContent = "E-MAIL CADASTRADO: " + email;
        } else {
            caixaEmail.style.display = "none";
        }

        // leva o usuario pra tela de login qnd ele clicar no botao
        document.getElementById("btnLogin").addEventListener("click", function () {
            window.location.href = "/index.html";
        });
    </script>
</body>

</html>
