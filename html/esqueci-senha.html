<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiri — Redefinir senha</title>

    <!-- carrega as fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Montserrat:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- carrega os icones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* reseta os espacamentos padrao */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* define o estilo geral da pagina */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2D6A4F;
            font-family: 'Montserrat', sans-serif;
            color: #F5EFE0;
            padding: 40px 20px;
        }

        /* organiza o bloco principal da pagina */
        .card {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* define o estilo da logo */
        .logo {
            width: 190px;
            height: auto;
            display: block;
            margin: 0 auto 25px;
        }

        /* define o estilo da frase abaixo da logo */
        .tagline {
            font-family: 'Caveat', cursive;
            font-weight: 600;
            font-size: 1.55rem;
            color: #F5EFE0;
            text-align: center;
            margin-bottom: 34px;
            letter-spacing: .01em;
        }

        /* define o estilo do titulo da pagina */
        .title {
            width: 100%;
            text-align: center;
            color: #F5EFE0;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* define o estilo do texto de explicacao */
        .description {
            width: 100%;
            text-align: center;
            color: #F5EFE0;
            font-size: 0.94rem;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        /* organiza o formulario */
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* esconde o label sem prejudicar a acessibilidade */
        .field label {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* define o estilo da caixa do campo */
        .field-wrap {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #F5EFE0;
            border-radius: 8px;
            height: 52px;
            padding: 0 16px;
            border: 1.5px solid transparent;
            transition: border-color .2s ease, transform .12s ease;
        }

        /* destaca o campo qnd ele esta selecionado */
        .field-wrap:focus-within {
            border-color: #2D6A4F;
        }

        /* define o estilo do icone do campo */
        .field-wrap i.field-icon {
            color: #2D6A4F;
            font-size: .95rem;
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        /* define o estilo do campo de entrada */
        .field-wrap input {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #2D6A4F;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: .74rem;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        /* define o estilo do texto do placeholder */
        .field-wrap input::placeholder {
            color: rgba(45, 106, 79, .75);
            opacity: 1;
        }

        /* define o estilo da mensagem de erro */
        .error-message {
            display: none;
            color: #F5EFE0;
            margin-top: 5px;
            font-size: 14px;
        }

        /* mostra a mensagem de erro qnd necessario */
        .error-message.show {
            display: block;
        }

        /* destaca o campo qnd ocorre um erro */
        .input-error {
            border: 1px solid #2D6A4F !important;
        }

        /* define o estilo do botao principal */
        .btn-primary {
            margin-top: 10px;
            height: 54px;
            border: none;
            border-radius: 10px;
            background: #F5EFE0;
            color: #2D6A4F;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: .95rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background .2s ease, transform .12s ease, box-shadow .2s ease;
        }

        /* aplica o efeito do botao qnd passa o mouse */
        .btn-primary:hover {
            background: rgba(245, 239, 224, .9);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px -8px rgba(45, 106, 79, .5);
        }

        /* aplica o efeito do botao qnd ele e clicado */
        .btn-primary:active {
            transform: translateY(0);
        }

        /* define o estilo do link pra voltar ao login */
        .back-login {
            display: table;
            margin: 22px auto 0;
            color: #F5EFE0;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            font-size: .65rem;
            transition: color .15s ease;
        }

        /* muda a cor do link qnd passa o mouse */
        .back-login:hover {
            color: rgba(245, 239, 224, .75);
        }

        /* ajusta a pagina pra telas menores */
        @media (max-width: 340px) {

            /* diminui a logo em telas pequenas */
            .logo {
                width: 160px;
            }

            /* ajusta o tamanho da frase em telas pequenas */
            .tagline {
                font-size: 1.35rem;
            }
        }
    </style>
</head>

<body>
    <!-- organiza o conteudo principal da pagina -->
    <main class="card">
        <!-- mostra a logo do quiri -->
        <img class="logo" src="/imagens/logobranca.png" alt="logo quiri">
        <!-- mostra o titulo da pagina -->
        <h1 class="title">
            Redefinir senha
        </h1>
        <!-- mostra o texto de explicacao -->
        <p class="description">
            Digite seu e-mail e enviaremos um link para redefinir sua senha.
        </p>
        <!-- organiza o formulario de redefinicao -->
        <form id="formRedefinirSenha" autocomplete="on">
            <div class="field">
                <!-- define o label acessivel do campo de email -->
                <label for="email">
                    E-mail
                </label>
                <!-- cria o campo de email -->
                <div class="field-wrap">
                    <i class="field-icon fa-solid fa-envelope" aria-hidden="true"></i>
                    <input id="email" name="email" type="email" placeholder="E-MAIL" autocomplete="email" required>
                </div>
                <!-- mostra a mensagem de erro do email -->
                <p id="err-email" class="error-message">
                    Digite um e-mail válido.
                </p>
            </div>
            <!-- envia o pedido de redefinicao de senha -->
            <button type="submit" class="btn-primary">
                Enviar link
            </button>
        </form>
        <!-- cria o link pra voltar ao login -->
        <a class="back-login" href="login.html">
            Voltar para o login
        </a>
    </main>
    <!-- carrega o javascript da redefinicao de senha -->
    <script type="module" src="../js/esqueci-senha.js"></script>
</body>

</html>
